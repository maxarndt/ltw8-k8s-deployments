apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: grafana
  labels:
    app: grafana
data:
  datasources.yaml: |
    apiVersion: 1
    deleteDatasources:
      - name: vmalert
        orgId: 1
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        uid: cf52cqte7bojke
        url: http://victoriametrics.observability.svc.cluster.local:8428
        access: proxy
        isDefault: true
        editable: false
        jsonData:
          manageAlerts: true
