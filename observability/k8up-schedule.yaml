---
# K8up maintenance schedule for the observability namespace.
# See grafana/k8up-schedule.yaml for the rationale.
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: observability-maintenance
  namespace: observability
spec:
  failedJobsHistoryLimit: 2
  successfulJobsHistoryLimit: 2
  backend:
    repoPasswordSecretRef:
      name: k8up-backup-credentials
      key: repo-password
    s3:
      endpoint: https://s3.eu-central-003.backblazeb2.com
      bucket: ltw8-kubernetes-backup-01/observability
      accessKeyIDSecretRef:
        name: k8up-backup-credentials
        key: username
      secretAccessKeySecretRef:
        name: k8up-backup-credentials
        key: password
  prune:
    schedule: '15 3 * * 0'
    retention:
      keepDaily: 7
      keepWeekly: 4
      keepMonthly: 6
  check:
    schedule: '15 4 1 * *'
