---
# Restore template — copy and adjust the marked fields before applying.
#
# See ../k8up/README.md "Restore" for the full procedure. Short version:
#   1. List snapshots via the helper Job at the bottom of this file
#      (edit REPLACE_NAMESPACE, apply, read `kubectl -n <ns> logs job/list-snapshots`).
#   2. Scale workload to 0 and wait for pod termination (releases the RWO PVC).
#   3. Delete the PVC and re-create it as a standalone PVC manifest
#      (do NOT re-apply the workload yaml — that scales replicas back to 1
#      and the pod races the Restore onto the empty PVC).
#   4. Edit the Restore CR below: namespace, snapshot, claimName, bucket suffix.
#   5. kubectl apply -f <this-file>
#   6. kubectl -n <ns> wait --for=condition=Completed restore/<name> --timeout=15m
#   7. Scale workload back to 1. The `data-perm` initContainer on the workload
#      fixes the ownership of the restored files automatically.
apiVersion: k8up.io/v1
kind: Restore
metadata:
  name: restore-REPLACE-ME
  namespace: REPLACE_NAMESPACE   # grafana | observability | nats
spec:
  # Empty snapshot = latest. Otherwise paste the snapshot ID from
  # `restic snapshots` or the k8up list-snapshots Job output.
  snapshot: ""
  restoreMethod:
    folder:
      claimName: REPLACE_PVC_NAME   # grafana-data | victoriametrics-data | nats-data
  backend:
    repoPasswordSecretRef:
      name: k8up-backup-credentials
      key: repo-password
    s3:
      endpoint: https://s3.eu-central-003.backblazeb2.com
      bucket: ltw8-kubernetes-backup-01/REPLACE_NAMESPACE
      accessKeyIDSecretRef:
        name: k8up-backup-credentials
        key: username
      secretAccessKeySecretRef:
        name: k8up-backup-credentials
        key: password
---
# Helper: one-shot pod that runs `restic snapshots` against a specific
# namespace's repo. Apply it, then `kubectl -n <ns> logs job/list-snapshots`.
# Edit the bucket suffix to match the namespace you want to inspect.
apiVersion: batch/v1
kind: Job
metadata:
  name: list-snapshots
  namespace: REPLACE_NAMESPACE
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: restic
          image: restic/restic:0.17.3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: RESTIC_REPOSITORY
              value: s3:https://s3.eu-central-003.backblazeb2.com/ltw8-kubernetes-backup-01/REPLACE_NAMESPACE
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: k8up-backup-credentials
                  key: username
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: k8up-backup-credentials
                  key: password
            - name: RESTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k8up-backup-credentials
                  key: repo-password
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/cache
          command: ["restic", "snapshots", "--compact"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
