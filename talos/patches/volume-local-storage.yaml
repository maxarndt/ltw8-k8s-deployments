# User Volume auf der System-Disk, gemountet unter /var/mnt/local-storage.
# Wird vom local-path-provisioner als Backing-Store genutzt (siehe ../local-path/).
# grow: true → füllt den nach EPHEMERAL/STATE/Boot verbleibenden Platz auf.
# Bei Disk-Wechsel auf größere Hardware wächst das Volume automatisch mit.
apiVersion: v1alpha1
kind: UserVolumeConfig
name: local-storage
provisioning:
  diskSelector:
    match: system_disk
  minSize: 10GiB
  grow: true
