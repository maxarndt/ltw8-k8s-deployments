---
# K8up maintenance schedule for the nats namespace.
# See grafana/k8up-schedule.yaml for the rationale.
apiVersion: k8up.io/v1
kind: Schedule
metadata:
  name: nats-maintenance
  namespace: nats
spec:
  failedJobsHistoryLimit: 2
  successfulJobsHistoryLimit: 2
  backend:
    repoPasswordSecretRef:
      name: k8up-backup-credentials
      key: repo-password
    s3:
      endpoint: https://s3.eu-central-003.backblazeb2.com
      bucket: ltw8-backup/nats
      accessKeyIDSecretRef:
        name: k8up-backup-credentials
        key: username
      secretAccessKeySecretRef:
        name: k8up-backup-credentials
        key: password
  prune:
    schedule: '30 3 * * 0'
    retention:
      keepDaily: 7
      keepWeekly: 4
      keepMonthly: 6
  check:
    schedule: '30 4 1 * *'
